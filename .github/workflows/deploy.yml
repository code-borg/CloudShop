
name: CloudShop Azure Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CloudShop.slnx

      - name: Build
        run: dotnet build CloudShop.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CloudShop.slnx --configuration Release --no-build

      - name: Publish API
        run: dotnet publish src/CloudShop.Api/CloudShop.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudshop-api
          path: ./publish

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudshop-api
          path: ./publish

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: cloudshop-api-borg-dev
          package: ./publish

      - name: Verify Key Vault endpoint
        shell: bash
        run: |
          set -o pipefail
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            "https://cloudshop-api-borg-dev-axcsbdcnasbnhafw.centralindia-01.azurewebsites.net/configuration/welcome" \
            | grep -Fq 'Hello from Azure Key Vault!'

      - name: Verify Azure SQL endpoint
        shell: bash
        run: |
          set -o pipefail
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            "https://cloudshop-api-borg-dev-axcsbdcnasbnhafw.centralindia-01.azurewebsites.net/products" \
            | grep -Fq '"name":"Test Laptop"'




name: CloudShop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CloudShop.slnx

      - name: Build solution
        run: dotnet build CloudShop.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CloudShop.slnx --configuration Release --no-build
